[project]
name = "changeguard"
version = "0.1.0"
description = "Evidence-grounded code-change risk analysis: deterministic static analysis plus verified, optional AI synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ChangeGuard contributors" }]
keywords = ["static-analysis", "code-review", "risk", "tree-sitter", "llm", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  # Ruff is used as an analysis engine (invoked on stdin, never executes analysed code).
  "ruff>=0.6",
  "defusedxml>=0.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional Claude provider (CHANGEGUARD_AI_PROVIDER=anthropic).
anthropic = ["anthropic>=1.0"]

[project.scripts]
changeguard = "changeguard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "types-defusedxml>=0.7",
  "anthropic>=1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changeguard"]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Sample scenarios intentionally contain buggy code for the analyzer to find.
extend-exclude = ["tests/fixtures", "src/changeguard/samples/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "C4", "PIE", "RET", "ASYNC"]
ignore = [
  "E501",   # long lines are handled by the formatter
  "S101",   # assert is fine in tests and internal invariants
  "S603",   # subprocess without shell is intentional (ruff/git invocation with fixed argv)
  "RUF001", # we deliberately handle unicode in patch content
  "PT018",  # composite assertions are clearer for multi-field invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT011"]
# git is resolved from PATH on purpose (developer/CI tooling), with hooks and external diff drivers disabled.
"src/changeguard/cli.py" = ["S607"]
"src/changeguard/evaluation/runner.py" = ["S607"]
# Every query is parameterised; the only interpolated fragments are module constants.
"src/changeguard/storage/db.py" = ["S608"]
"tools/**" = ["S607"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["src/changeguard/samples/data/"]
warn_unreachable = true
mypy_path = "src"
packages = ["changeguard"]

[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript", "ruff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: exercises the HTTP API end to end",
  "live_model: requires a running local model (skipped unless CHANGEGUARD_TEST_LIVE_MODEL=1)",
]
filterwarnings = ["error::DeprecationWarning:changeguard.*"]

[tool.coverage.run]
source = ["changeguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
