name: ChangeGuard
description: Evidence-grounded risk analysis for pull requests. Annotates changed lines, posts a summary comment and can fail the check.
author: Chethan K Murthy
branding:
  icon: shield
  color: green

inputs:
  base:
    description: Revision to compare against. Defaults to the pull request's base branch.
    required: false
    default: ""
  fail-on:
    description: Fail when a deterministic or heuristic finding is at or above this severity (critical, high, medium, low, never). AI findings never fail the check.
    required: false
    default: high
  coverage:
    description: Coverage report for the head revision (Cobertura XML, LCOV or coverage.py JSON). Enables the coverage-of-changed-lines findings.
    required: false
    default: ""
  comment:
    description: Post the report as a pull request comment, updated in place on every push.
    required: false
    default: "true"
  sarif:
    description: Upload findings to GitHub code scanning so they appear on the changed lines.
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment.
    required: false
    default: ${{ github.token }}

outputs:
  findings:
    description: Number of findings.
    value: ${{ steps.analyse.outputs.findings }}
  priority:
    description: Review priority (block, high, elevated or routine).
    value: ${{ steps.analyse.outputs.priority }}
  gate:
    description: "\"fail\" when a finding reached the fail-on severity, otherwise \"pass\"."
    value: ${{ steps.analyse.outputs.gate }}
  report-dir:
    description: Directory holding report.json, report.md and report.sarif.
    value: ${{ steps.analyse.outputs.report-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ChangeGuard
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH/backend"

    - name: Analyse the change
      id: analyse
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base }}
        BASE_REF: ${{ github.base_ref }}
        FAIL_ON: ${{ inputs.fail-on }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/changeguard"
        mkdir -p "$out"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --quiet --no-tags --unshallow origin
        fi
        base="$BASE_INPUT"
        if [ -z "$base" ]; then
          if [ -z "$BASE_REF" ]; then
            echo "::error::Not a pull request: set the 'base' input to the revision to compare against."
            exit 2
          fi
          git fetch --quiet --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base="origin/$BASE_REF"
        fi
        merge_base="$(git merge-base "$base" HEAD)"
        args=(analyze --git-repo . --base "$merge_base" --head HEAD --fail-on "$FAIL_ON"
              --json-out "$out/report.json" --markdown-out "$out/report.md" --sarif-out "$out/report.sarif")
        if [ -n "$COVERAGE" ]; then
          args+=(--coverage "$COVERAGE")
        fi
        set +e
        changeguard "${args[@]}"
        status=$?
        set -e
        if [ "$status" -gt 1 ]; then
          echo "::error::ChangeGuard could not analyse the change (exit $status)."
          exit "$status"
        fi
        python - "$out/report.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        report = json.load(open(sys.argv[1]))
        print(f"findings={report['summary']['findings_total']}")
        print(f"priority={report['summary']['review_priority']['level']}")
        PY
        echo "gate=$([ "$status" -eq 1 ] && echo fail || echo pass)" >> "$GITHUB_OUTPUT"
        echo "report-dir=$out" >> "$GITHUB_OUTPUT"
        cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload findings to code scanning
      if: inputs.sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.analyse.outputs.report-dir }}/report.sarif
        category: changeguard

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPORT: ${{ steps.analyse.outputs.report-dir }}/report.md
      run: python "$GITHUB_ACTION_PATH/deploy/github/pr_comment.py" "$REPORT"

    - name: Apply the severity gate
      if: steps.analyse.outputs.gate == 'fail'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::ChangeGuard found at least one non-AI finding at or above '$FAIL_ON' severity. See the report in the job summary."
        exit 1
